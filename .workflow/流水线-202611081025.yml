version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 测试、构建、上传、发布、部署到自有主机
stages:
- name: 测试
  displayName: 测试
  strategy: naturally
  trigger: auto
  steps:
  - step: ut@maven
    name: ""
    displayName: Maven 单元测试
    jdkVersion: "8"
    mavenVersion: 3.3.9
    commands:
    - "# Maven单元测试默认命令"
    - mvn -B test -Dmaven.test.failure.ignore=true
    - mvn surefire-report:report-only
    - mvn site -DgenerateReports=false
    report:
      path: ./target/site
      index: surefire-report.html
    checkpoints: {}
    settings: []
    caches:
    - "~/.m2"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@maven
    name: ""
    displayName: Maven 构建
    mavenVersion: 3.3.9
    commands:
    - "# 功能：打包"
    - "# 参数说明："
    - "#    -Dmaven.test.skip=true：跳过单元测试"
    - "#    -U：每次构建检查依赖更新，可避免缓存中快照版本依赖不更新问题，但会牺牲部分性能"
    - "#    -e -X ：打印调试信息，定位疑难构建问题时建议使用此参数构建"
    - "#    -B：以batch模式运行，可避免日志打印时出现ArrayIndexOutOfBoundsException异常"
    - "# 使用场景：打包项目且不需要执行单元测试时使用"
    - mvn clean package -Dmaven.test.skip=true -U -e -X -B
    - ""
    - "# 功能：自定义settings配置"
    - "# 使用场景：如需手工指定settings.xml，可使用如下方式"
    - "# 注意事项：如无需自定义settings配置且需要私有依赖仓库，可在该任务配置《私有仓库》处添加私有依赖"
    - "# mvn -U clean package -s ./settings.xml"
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./target
      type: .tar.gz
    settings: []
    caches:
    - "~/.m2"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: ""
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: ""
    displayName: 发布
    dependArtifact: output
    version: 1.0.0.0
    autoIncrement: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
