<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP Client</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="hc-app" id="app">
      <header class="hc-topbar">
        <button class="hc-icon-btn" id="btn-toggle-sidebar" type="button" title="折叠/展开侧栏">☰</button>
        <div class="hc-brand">
          <img class="hc-brand-mark" src="assets/plugin.svg" width="20" height="20" alt="" />
          <span id="brand-name">HTTP Client</span>
        </div>
        <div class="hc-grow"></div>
        <div class="hc-env-picker" id="env-picker">
          <button type="button" class="hc-env-picker-trigger" id="env-picker-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="hc-env-picker-icon" aria-hidden="true"></span>
            <span class="hc-env-picker-label" id="env-picker-label">无环境</span>
            <span class="hc-env-picker-caret" aria-hidden="true">▾</span>
          </button>
        </div>
        <button class="hc-btn hc-btn-ghost" id="btn-import-curl" type="button">导入 cURL</button>
        <button class="hc-btn hc-btn-ghost" id="btn-dynamic-vars" type="button">内置变量</button>
        <button class="hc-btn hc-btn-ghost" id="btn-settings" type="button">设置</button>
      </header>

      <div class="hc-body">
        <aside class="hc-sidebar" id="sidebar">
          <div class="hc-side-chrome">
            <nav class="hc-side-tabs" role="tablist">
              <button class="hc-side-tab is-active" data-side-view="collections" type="button">集合</button>
              <button class="hc-side-tab" data-side-view="history" type="button">历史</button>
              <button class="hc-side-tab" data-side-view="environments" type="button">环境</button>
            </nav>
            <div class="hc-side-actions" id="sidebar-actions"></div>
          </div>
          <div class="hc-side-body" id="sidebar-body"></div>
        </aside>
        <div class="hc-splitter" id="sidebar-splitter" title="拖动调整宽度"></div>

        <main class="hc-main">
          <div class="hc-tabstrip" id="tabstrip"></div>

          <section class="hc-env-pane" id="env-pane" hidden></section>

          <section class="hc-request" id="request-pane">
            <div class="hc-request-name-row">
              <input id="request-title" class="hc-input hc-request-title" type="text" spellcheck="false"
                     autocomplete="off" placeholder="未命名接口" />
              <div class="hc-request-tools">
                <button class="hc-icon-btn" id="btn-save" type="button" title="保存到集合">☆</button>
                <button class="hc-icon-btn" id="btn-copy-curl" type="button" title="复制为 cURL">⌘</button>
              </div>
            </div>
            <div class="hc-url-row" data-method="GET">
              <div class="hc-method-picker" id="method-picker">
                <button type="button" class="hc-method-trigger" id="method-trigger"
                        aria-haspopup="listbox" aria-expanded="false" aria-label="HTTP 方法">
                  <span class="hc-method-label" id="method-label">GET</span>
                  <span class="hc-method-caret" aria-hidden="true"></span>
                </button>
                <select id="method-select" class="hc-method-native" tabindex="-1" aria-hidden="true" hidden></select>
              </div>
              <div class="hc-url-wrap">
                <div class="hc-url-highlight" id="url-highlight" aria-hidden="true"></div>
                <input id="url-input" class="hc-input hc-url" type="text" spellcheck="false" autocomplete="off"
                       placeholder="https://api.example.com/users" />
                <span class="hc-url-flag" id="url-flag" hidden></span>
              </div>
              <button class="hc-btn hc-btn-send" id="btn-send" type="button">发送</button>
              <button class="hc-btn hc-btn-danger" id="btn-cancel" type="button" hidden>取消</button>
            </div>

            <div class="hc-sections" id="request-sections"></div>
            <div class="hc-panels" id="request-panels"></div>
          </section>

          <div class="hc-splitter hc-splitter-h" id="pane-splitter" title="拖动调整高度"></div>

          <section class="hc-response" id="response-pane"></section>
        </main>
      </div>

      <div class="hc-toasts" id="toast-host"></div>
      <div class="hc-modal-layer" id="modal-host" hidden></div>
    </div>

    <script src="i18n.js"></script>
    <script src="util.js"></script>
    <script src="download-name.js"></script>
    <script src="bridge.js"></script>
    <script src="curl.js"></script>
    <script src="apipost.js"></script>
    <script src="scripts.js"></script>
    <script src="clients.js"></script>
    <script src="store.js"></script>
    <script src="view-sidebar.js"></script>
    <script src="view-env.js"></script>
    <script src="view-request.js"></script>
    <script src="view-response.js"></script>
    <script src="app.js"></script>
  </body>
</html>
