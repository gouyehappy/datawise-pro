[package]
name = "datawise-plugin-ssh"
version = "0.7.11-beta.17"
edition = "2021"
license = "MIT"
authors = ["datawise-community"]

[[bin]]
name = "datawise-plugin-ssh"
path = "src/main.rs"

[workspace]

[dependencies]
# Session import (connection_import.rs): AES-256-CBC for WindTerm autoLogin.
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.23"
# CBC mode with PKCS7 for WindTerm decrypt (defaults off in transitive trees).
cbc = { version = "0.2", default-features = false, features = ["alloc", "block-padding"] }
data-encoding = "2"
datawise-plugin-sdk = "0.1.0"
# GBK decoding for Xshell .xts ZIP entry names (Chinese Windows exports).
encoding_rs = "0.8"
flate2 = "1"
getrandom = "0.4"
hmac = "0.13"
if-addrs = "0.15.0"
# WindTerm autoLogin KDF: PBKDF2-HMAC-SHA3-512.
pbkdf2 = "0.13"
# Terminal trigger (expect) stage patterns — see src/triggers.rs.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
russh = { version = "0.62", features = ["des"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# Xshell .xts session archives (deflate only; zip-bomb guards in connection_import.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }

portable-pty = "0.9.0"
rqrr = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
notify = "6"
serialport = "4"
vnc-rs = "0.6"
ironrdp = { version = "0.17", default-features = false, features = ["client", "client-clipboard", "cliprdr", "connector", "core", "input", "pdu"] }
smallvec = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
pageant = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
ironrdp = { version = "0.17", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
ironrdp = { version = "0.17", default-features = false, features = ["rustls"] }

# The OS keychain tier only ships where a native keychain exists; the Linux
# secret-service backend pulls libdbus (absent in store build containers and
# on headless servers), so Linux always uses the keyfile tier. keyring 4's
# default "v1" feature keeps the Entry API and target-gates each native
# backend (apple keychain / windows native), so no explicit feature list.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4"

# Sidecar SDK is vendored under shared/ for a self-contained plugin tree.
[patch.crates-io]
datawise-plugin-sdk = { path = "../shared/sdk/rust/datawise-plugin-sdk" }

ironrdp = { path = "vendor/ironrdp" }
ironrdp-async = { path = "vendor/ironrdp-async" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-client = { path = "vendor/ironrdp-client" }
ironrdp-tls = { path = "vendor/ironrdp-tls" }
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }

[dev-dependencies]
tempfile = "3"
