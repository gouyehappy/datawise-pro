      b.onclick = () => {
        selectedRef = 'stash:' + ref
        view = 'history'
        historyRef = ref
        selectedRev = ref
        selectedCommitPath = ''
        logQuery = ''
        paint()
      }
      b.ondblclick = async () => {
        const res = await invoke('git/stash', { action: 'apply', ref })
        if (!reportFail('应用贮藏失败', res)) return
        toast('已应用贮藏')
        openWorking()
      }
      b.oncontextmenu = (e) => showCtx(e, [
        { cap: ref || '贮藏' },
        { label: '应用 (Apply)', run: async () => {
          const res = await invoke('git/stash', { action: 'apply', ref })
          if (!reportFail('应用贮藏失败', res)) return
          toast('已应用'); openWorking()
        } },
        { label: '弹出 (Pop)', run: async () => {
          const res = await invoke('git/stash', { action: 'pop', ref })
          if (!reportFail('弹出贮藏失败', res)) return
          toast('已弹出'); openWorking()
        } },
        { label: '复制说明', run: () => copy(line) },
        '|',
        { label: '丢弃 (Drop)', danger: true, run: async () => {
          if (!(await confirmDanger('丢弃贮藏 ' + (ref || '') + '？'))) return
          const res = await invoke('git/stash', { action: 'drop', ref, allowDangerous })
          if (!reportFail('丢弃贮藏失败', res)) return
          toast('已丢弃'); await refreshAll()
        } }
      ])
    })
  }

  function splitPath(p) {
    const norm = String(p || '').replace(/\\/g, '/')
    const i = norm.lastIndexOf('/')
    if (i < 0) return { base: norm, dir: '' }
    return { base: norm.slice(i + 1), dir: norm.slice(0, i) }
  }

  function matchFilter(path) {
    const q = fileFilter.trim().toLowerCase()
    if (!q) return true
    return String(path || '').toLowerCase().includes(q)
  }

  function fileEntries() {
    const out = []
    for (const r of (statusData?.conflicted || [])) if (matchFilter(r.path)) out.push({ ...r, kind: 'conflicted' })
    for (const r of (statusData?.staged || [])) if (matchFilter(r.path)) out.push({ ...r, kind: 'staged' })
    for (const r of (statusData?.unstaged || [])) if (matchFilter(r.path)) out.push({ ...r, kind: 'unstaged' })
    for (const r of (statusData?.untracked || [])) if (matchFilter(r.path)) out.push({ ...r, kind: 'untracked' })
    return out
  }

  function fileRowHtml(r, kind) {
    const staged = kind === 'staged'
    const conflict = kind === 'conflicted'
    const code = conflict ? 'U' : (r.code || (r.xy || '?').trim().slice(-1) || '?')
    const sel = (selectedPath === r.path && selectedKind === kind) ? ' sel mark' : ''
    const act = staged ? 'unstage' : 'stage'
    const tipAct = conflict ? '标记已解决 (git add)' : (staged ? '取消暂存' : '暂存')
    const path = String(r.path || '').replace(/\\/g, '/')
    return '<div class="file' + sel + (conflict ? ' conflict' : '') + '" data-path="' + esc(r.path) + '" data-kind="' + kind + '" title="' + esc(path) + '\n' + tipAct + ' · 单击预览 · Ctrl+单击多选">'
      + '<span class="code ' + esc(code) + '">' + esc(code) + '</span>'
      + '<span class="fpath">' + esc(path) + '</span>'
      + '<span class="f-act"><button type="button" class="btn" data-act="' + act + '" title="'
      + tipAct + '">' + (conflict ? '✓' : (staged ? '−' : '+')) + '</button></span></div>'
  }

  /** groups: [{ rows, kind }], emptyMsg when all empty */
  function fileRowsGroups(groups, emptyMsg) {
    let html = ''
    let n = 0
    for (const g of groups) {
      for (const r of (g.rows || [])) {
        if (!matchFilter(r.path)) continue
        html += fileRowHtml(r, g.kind)
        n++
      }
    }
    if (!n) return '<div class="empty-soft">' + esc(emptyMsg) + '</div>'
    return html
  }

  function diffStats(text) {
    let add = 0, del = 0
    for (const line of String(text || '').split('\n')) {
      if (line.startsWith('+') && !line.startsWith('+++')) add++
      else if (line.startsWith('-') && !line.startsWith('---')) del++
    }
    return { add, del }
  }

  /** Parse unified diff into hunks with self-contained patches (SourceTree-style). */
  function parseDiffHunks(text) {
    const lines = String(text || '').split('\n')
    const hunks = []
    let fileHeader = []
    let i = 0
    while (i < lines.length) {
      const line = lines[i]
      if (line.startsWith('diff --git ')) {
        fileHeader = [line]
        i++
        while (i < lines.length && !lines[i].startsWith('@@') && !lines[i].startsWith('diff --git ')) {
          fileHeader.push(lines[i])
          i++
        }
        continue
      }
      if (line.startsWith('@@')) {
        const hunkLines = [line]
        i++
        while (i < lines.length && !lines[i].startsWith('@@') && !lines[i].startsWith('diff --git ')) {
          hunkLines.push(lines[i])
          i++
        }
        // Prefer a clean header: diff + ---/+++
        let header = fileHeader.slice()
        if (!header.some(l => l.startsWith('--- ')) || !header.some(l => l.startsWith('+++ '))) {
          // keep as-is; git apply may still work with diff --git alone in some versions
        }
        const patch = header.concat(hunkLines).join('\n') + '\n'
        hunks.push({
          id: 'h' + hunks.length,
          header: line,
          body: hunkLines.slice(1),
          patch
        })
        continue
      }
      i++
    }
    return hunks
  }

  function colorDiff(text, opts) {
    opts = opts || {}
    if (!text) {
      return '<div class="diff-empty">选择左侧文件查看差异<br/><span style="font-size: var(--dw-font-size);opacity:.85">快捷键 <kbd>j</kbd>/<kbd>k</kbd> · <kbd>Space</kbd> 暂存 · 块级暂存在下方</span></div>'
    }
    const hunks = opts.withHunks ? parseDiffHunks(text) : []
    lastHunks = hunks
    if (!opts.withHunks || !hunks.length) {
      return '<pre class="diff">' + String(text).split('\n').map(line => {
        const e = esc(line) || ' '
        let cls = 'ln'
        if (line.startsWith('@@')) cls += ' hunk'
        else if (line.startsWith('+') && !line.startsWith('+++')) cls += ' add'
        else if (line.startsWith('-') && !line.startsWith('---')) cls += ' del'
        else if (line.startsWith('diff ') || line.startsWith('index ') || line.startsWith('+++') || line.startsWith('---')) cls += ' meta'
        return '<span class="' + cls + '">' + e + '</span>'
      }).join('') + '</pre>'
    }

    const staged = !!opts.staged
    let html = '<div class="diff">'
    // file meta lines before first hunk
    const firstPatchLines = hunks[0].patch.split('\n')
    for (const line of firstPatchLines) {
      if (line.startsWith('@@')) break
      if (!line) continue
      html += '<span class="ln meta">' + esc(line) + '</span>'
    }
    hunks.forEach((h, idx) => {
      const stageLabel = staged ? '取消暂存此块' : '暂存此块'
      const stageAct = staged ? 'unstage' : 'stage'
      html += '<div class="hunk-bar" data-hunk="' + idx + '">'
        + '<span class="hunk-meta">' + esc(h.header) + '</span>'
        + '<div class="acts">'
        + '<button type="button" class="btn btn-quiet btn-xs" data-hunk-act="' + stageAct + '">' + stageLabel + '</button>'
        + (staged ? '' : '<button type="button" class="btn btn-danger btn-xs" data-hunk-act="discard">丢弃此块</button>')
        + '</div></div>'
      html += '<span class="ln hunk">' + esc(h.header) + '</span>'
      for (const line of h.body) {
        let cls = 'ln'
        if (line.startsWith('+') && !line.startsWith('+++')) cls = 'ln add'
        else if (line.startsWith('-') && !line.startsWith('---')) cls = 'ln del'
        html += '<span class="' + cls + '">' + (esc(line) || ' ') + '</span>'
      }
    })
    html += '</div>'
    return html
  }

  async function applyHunk(action, hunkIndex) {
    const h = lastHunks[hunkIndex]
    if (!h) return
    if (action === 'discard' && !(await confirmDanger('丢弃此差异块？不可恢复。'))) return
    const res = await invoke('git/apply-patch', { patch: h.patch, action, allowDangerous })
    toast(res.success
      ? (action === 'stage' ? '已暂存此块' : action === 'unstage' ? '已取消此块' : '已丢弃此块')
      : (res.message || '块操作失败'))
    if (res.success) await refreshStatus(true)
  }

  function paintDiffHeader() {
    const staged = selectedKind === 'staged'
    const conflict = selectedKind === 'conflicted'
    const lab = $('diffLab')
    if (lab) {
      lab.textContent = conflict ? '冲突' : (staged ? '已暂存' : '工作区')
      lab.className = 'lab' + (staged ? ' staged' : '') + (conflict ? ' conflict' : '')
    }
    if ($('diffPath')) {
      if (!selectedPath) $('diffPath').textContent = '全部差异'
      else {
        const { base, dir } = splitPath(selectedPath)
        $('diffPath').textContent = dir ? base + '  ·  ' + dir : base
        $('diffPath').title = selectedPath
      }
    }
    const st = $('diffStats')
    if (st) {
      st.innerHTML = lastDiff
        ? '<span class="a">+' + lastDiffStats.add + '</span><span class="d">−' + lastDiffStats.del + '</span>'
        : ''
    }
    const stageBtn = $('diffStage')
    if (stageBtn) {
      const has = !!selectedPath
      stageBtn.disabled = !has
      stageBtn.textContent = staged ? '取消暂存' : '暂存'
      stageBtn.dataset.act = staged ? 'unstage' : 'stage'
    }
    const discardBtn = $('diffDiscard')
    if (discardBtn) discardBtn.disabled = !selectedPath || selectedKind === 'staged'
  }

  async function loadDiff() {
    const box = $('diffBody')
    if (!box) return
    const staged = selectedKind === 'staged'
    const pathSnap = selectedPath
    const kindSnap = selectedKind
    box.innerHTML = loadingHtml(selectedPath ? '加载差异…' : '加载中…')
    const res = await invoke('git/diff', { path: selectedPath || '', staged })
    if (pathSnap !== selectedPath || kindSnap !== selectedKind) return
    lastDiff = res.diff || ''
    lastDiffStats = diffStats(lastDiff)
    paintDiffHeader()
    box.classList.remove('is-fading')
    const canHunk = !!selectedPath && selectedKind !== 'untracked' && selectedKind !== 'conflicted'
    if (selectedKind === 'conflicted' && !lastDiff) {
      box.innerHTML = '<div class="diff-empty">冲突文件 · 请在外部编辑器解决后点「✓」标记已解决<br/><span style="font-size: var(--dw-font-size);opacity:.85">或使用「全部标记已解决 / 中止」</span></div>'
    } else {
      box.innerHTML = colorDiff(lastDiff || res.message, { withHunks: canHunk, staged })
    }
    box.querySelectorAll('[data-hunk-act]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation()
        const bar = btn.closest('[data-hunk]')
        const idx = Number(bar?.dataset.hunk)
        applyHunk(btn.dataset.hunkAct, idx)
      }
    })
    void box.offsetWidth
    box.classList.add('is-fading')
  }

  function fileCountLabel(n) {
    return n === 1 ? '1 文件' : (n + ' 文件')
  }

  function changesHtml() {
    const staged = statusData?.staged || []
    const unstaged = statusData?.unstaged || []
    const untracked = statusData?.untracked || []
    const conflicted = statusData?.conflicted || []
    const changeN = unstaged.length + untracked.length
    const unEmpty = fileFilter.trim() ? '无匹配文件' : '工作区干净'
    const stEmpty = fileFilter.trim() ? '无匹配文件' : '暂存区为空'
    let html = '<div class="changes-split">'
    if (conflicted.length || statusData?.merging || statusData?.rebasing || statusData?.cherryPicking) {
      const abortKind = conflictAbortKind()
      html += '<section class="pane conflict">'
        + '<div class="sec-h"><span class="label">' + esc(conflictProgressLabel()) + '</span>'
        + '<span class="cnt">(' + conflicted.length + ')</span>'
        + '<div class="acts">'
        + (conflicted.length
          ? '<button type="button" class="btn" id="resolveAll" title="git add 全部冲突文件">全部标记已解决</button>'
          : '')
        + (abortKind
          ? '<button type="button" class="btn btn-danger" id="abortOp" title="放弃进行中的操作">中止</button>'
          : '')
        + '</div></div>'
        + '<div class="file-scroll">'
        + (conflicted.length
          ? fileRowsGroups([{ rows: conflicted, kind: 'conflicted' }], '无冲突')
          : '<div class="empty-soft">无未解决冲突 · 可提交完成或中止</div>')
        + '</div></section>'
    }
    /* SourceTree order: staged on top, unstaged below; heights fixed via --files-split */
    html += '<section class="pane staged">'
      + '<div class="sec-h"><span class="label">已暂存文件</span>'
      + '<span class="cnt">(' + esc(fileCountLabel(staged.length)) + ')</span>'
      + '<div class="acts">'
      + '<button type="button" class="btn" id="unstageAll"' + (staged.length ? '' : ' disabled') + '>取消所有暂存</button>'
      + '<button type="button" class="btn" id="unstageSel"' + (staged.length ? '' : ' disabled') + '>取消选定暂存</button>'
      + '</div></div>'
      + '<div class="file-scroll">'
      + fileRowsGroups([{ rows: staged, kind: 'staged' }], stEmpty)
      + '</div></section>'
      + '<div class="split-files" id="splitFiles" title="拖动调整上下分栏"></div>'
      + '<section class="pane unstaged">'
      + '<div class="sec-h"><span class="label">未暂存文件</span>'
      + '<span class="cnt">(' + esc(fileCountLabel(changeN)) + ')</span>'
      + '<div class="acts">'
      + '<button type="button" class="btn" id="stageAll" title="A"' + (changeN ? '' : ' disabled') + '>暂存所有</button>'
      + '<button type="button" class="btn" id="stageSel"' + (changeN ? '' : ' disabled') + '>暂存所选</button>'
      + '</div></div>'
      + '<div class="file-scroll">'
      + fileRowsGroups([{ rows: unstaged, kind: 'unstaged' }, { rows: untracked, kind: 'untracked' }], unEmpty)
      + '</div></section></div>'
    return html
  }

  function refreshChangesList() {
    const box = $('changes')
    if (!box) return
    const scrolls = {}
    box.querySelectorAll('.file-scroll').forEach((el, i) => { scrolls[i] = el.scrollTop })
    box.innerHTML = changesHtml()
    box.querySelectorAll('.file-scroll').forEach((el, i) => { if (scrolls[i] != null) el.scrollTop = scrolls[i] })
    applyFilesSplit()
    bindFilesSplit()
    bindFiles(body)
    wireStageButtons()
  }

  function markedOrSelectedPaths(kinds) {
    const allow = new Set(kinds)
    const marked = [...document.querySelectorAll('.file.mark')]
      .filter(el => allow.has(el.dataset.kind))
      .map(el => el.dataset.path)
      .filter(Boolean)
    if (marked.length) return [...new Set(marked)]
    if (allow.has(selectedKind) && selectedPath) return [selectedPath]
    return []
  }

  function wireStageButtons() {
    const staged = statusData?.staged || []
    const unstaged = statusData?.unstaged || []
    const untracked = statusData?.untracked || []
    const doStageAll = async () => {
      const paths = [...unstaged, ...untracked].map(x => x.path)
      if (!paths.length) return toast('没有可暂存文件')
      const res = await invoke('git/stage', { paths })
      toast(res.success ? '已全部暂存' : (res.message || '失败'))
      await refreshStatus(true)
    }
    const doUnstageAll = async () => {
      const paths = staged.map(x => x.path)
      if (!paths.length) return toast('暂存区为空')
      const res = await invoke('git/unstage', { paths })
      toast(res.success ? '已全部取消' : (res.message || '失败'))
      await refreshStatus(true)
    }
    const doStageSel = async () => {
      const paths = markedOrSelectedPaths(['unstaged', 'untracked', 'conflicted'])
      if (!paths.length) return toast('请先选择未暂存文件（Ctrl+单击可多选）')
      const res = await invoke('git/stage', { paths })
      toast(res.success ? ('已暂存 ' + paths.length + ' 个文件') : (res.message || '失败'))
      await refreshStatus(true)
    }
    const doUnstageSel = async () => {
      const paths = markedOrSelectedPaths(['staged'])
      if (!paths.length) return toast('请先选择已暂存文件（Ctrl+单击可多选）')
      const res = await invoke('git/unstage', { paths })
      toast(res.success ? ('已取消暂存 ' + paths.length + ' 个文件') : (res.message || '失败'))
      await refreshStatus(true)
    }
    if ($('stageAll')) $('stageAll').onclick = doStageAll
    if ($('unstageAll')) $('unstageAll').onclick = doUnstageAll
    if ($('stageSel')) $('stageSel').onclick = doStageSel
    if ($('unstageSel')) $('unstageSel').onclick = doUnstageSel
    if ($('resolveAll')) $('resolveAll').onclick = async () => {
      const paths = (statusData?.conflicted || []).map(x => x.path)
      if (!paths.length) return
      const res = await invoke('git/stage', { paths })
      toast(res.success ? '已标记解决' : (res.message || '失败'))
      await refreshStatus(true)
    }
    if ($('abortOp')) $('abortOp').onclick = async () => {
      const kind = conflictAbortKind()
      if (!kind) return
      const labels = { merge: '合并', rebase: '变基', 'cherry-pick': 'Cherry-pick' }
      if (!(await confirmDanger('中止' + (labels[kind] || kind) + '？未提交的解决进度会丢失。'))) return
      const res = await invoke('git/abort', { kind })
      if (!reportFail('中止失败', res)) return
      toast('已中止')
      await refreshAll()
    }
  }

  function showHelp(text) {
    let el = $('helpHint')
    if (!el) {
      el = document.createElement('div')
      el.id = 'helpHint'
      el.className = 'help-hint'
      document.body.appendChild(el)
    }
    el.textContent = text
    el.classList.add('show')
    clearTimeout(helpTimer)
    helpTimer = setTimeout(() => el.classList.remove('show'), 2200)
  }

  async function toggleStagePath(path, kind) {
    if (!path) return
    const staged = kind === 'staged'
    const conflict = kind === 'conflicted'
    const res = await invoke(staged ? 'git/unstage' : 'git/stage', { paths: [path] })
    toast(res.success
      ? (conflict ? '已标记解决' : (staged ? '已取消暂存' : '已暂存'))
      : (res.message || '失败'))
    if (res.success && !staged) selectedKind = 'staged'
    else if (res.success && staged) selectedKind = 'unstaged'
    await refreshStatus(true)
  }

  function moveFileSelection(delta) {
    const list = fileEntries()
    if (!list.length) return
    let idx = list.findIndex(x => x.path === selectedPath && x.kind === selectedKind)
    if (idx < 0) idx = delta > 0 ? -1 : 0
    idx = Math.max(0, Math.min(list.length - 1, idx + delta))
    selectedPath = list[idx].path
    selectedKind = list[idx].kind
    body.querySelectorAll('.file').forEach(el => {
      const on = el.dataset.path === selectedPath && el.dataset.kind === selectedKind
      el.classList.toggle('sel', on)
      if (on) el.scrollIntoView({ block: 'nearest' })
    })
    loadDiff()
  }

  function applyPaneWidths() {
    document.documentElement.style.setProperty('--tree', treeWidth + 'px')
    document.documentElement.style.setProperty('--files', filesWidth + 'px')
  }

  function applyFilesSplit() {
    document.documentElement.style.setProperty('--files-split', filesSplitPct + '%')
  }

  function bindFilesSplit() {
    const handle = $('splitFiles')
    if (!handle) return
    handle.onmousedown = (e) => {
      e.preventDefault()
      const split = handle.closest('.changes-split')
      if (!split) return
      handle.classList.add('dragging')
      const rect = split.getBoundingClientRect()
      const conflict = split.querySelector('.pane.conflict')
      const topOffset = conflict ? conflict.getBoundingClientRect().height : 0
      const usable = Math.max(120, rect.height - topOffset - 5)
      const onMove = (ev) => {
        const y = ev.clientY - rect.top - topOffset
        filesSplitPct = Math.max(18, Math.min(78, (y / usable) * 100))
        applyFilesSplit()
      }
      const onUp = () => {
        handle.classList.remove('dragging')
        document.removeEventListener('mousemove', onMove)
        document.removeEventListener('mouseup', onUp)
        remember('git.filesSplitPct', String(Math.round(filesSplitPct)))
      }
      document.addEventListener('mousemove', onMove)
      document.addEventListener('mouseup', onUp)
    }
  }

  function bindResize(handle, kind) {
    if (!handle) return
    handle.onmousedown = (e) => {
      e.preventDefault()
      handle.classList.add('dragging')
      const startX = e.clientX
      const startW = kind === 'tree' ? treeWidth : filesWidth
      const onMove = (ev) => {
        const next = startW + (ev.clientX - startX)
        if (kind === 'tree') {
          treeWidth = Math.max(160, Math.min(420, next))
          document.documentElement.style.setProperty('--tree', treeWidth + 'px')
        } else {
          filesWidth = Math.max(220, Math.min(520, next))
          document.documentElement.style.setProperty('--files', filesWidth + 'px')
        }
      }
      const onUp = () => {
        handle.classList.remove('dragging')
        document.removeEventListener('mousemove', onMove)
        document.removeEventListener('mouseup', onUp)
        remember(kind === 'tree' ? 'git.treeWidth' : 'git.filesWidth', String(kind === 'tree' ? treeWidth : filesWidth))
      }
      document.addEventListener('mousemove', onMove)
      document.addEventListener('mouseup', onUp)
    }
  }

  function bindSplits() {
    bindResize($('splitTree'), 'tree')
    bindResize($('split'), 'files')
    bindFilesSplit()
  }

  function bindFiles(root) {
    root.querySelectorAll('.file').forEach(el => {
      const path = el.dataset.path
      const kind = el.dataset.kind
      el.onclick = async (e) => {
        const act = e.target.closest?.('[data-act]')?.dataset?.act || e.target.dataset?.act
        if (act) {
          e.stopPropagation()
          await toggleStagePath(path, kind)
          return
        }
        if (e.ctrlKey || e.metaKey) {
          el.classList.toggle('mark')
          selectedPath = path
          selectedKind = kind
          root.querySelectorAll('.file').forEach(x => x.classList.toggle('sel', x === el))
          loadDiff()
          return
        }
        selectedPath = path
        selectedKind = kind
        root.querySelectorAll('.file').forEach(x => {
          x.classList.toggle('sel', x === el)
          x.classList.remove('mark')
        })
        el.classList.add('mark')
        loadDiff()
      }
      el.ondblclick = async (e) => {
        e.preventDefault()
        await toggleStagePath(path, kind)
      }
      el.oncontextmenu = (e) => {
        const staged = kind === 'staged'
        const untracked = kind === 'untracked'
        const conflict = kind === 'conflicted'
        const items = [
          { cap: path.split(/[/\\]/).pop() },
          conflict
            ? { label: '标记已解决 (git add)', run: async () => { await toggleStagePath(path, kind) } }
            : staged
            ? { label: '取消暂存', run: async () => {
              const res = await invoke('git/unstage', { paths: [path] })
              toast(res.success ? '已取消暂存' : (res.message || '失败')); await refreshStatus(true)
            } }
            : { label: '暂存', run: async () => {
              const res = await invoke('git/stage', { paths: [path] })
              toast(res.success ? '已暂存' : (res.message || '失败')); await refreshStatus(true)
            } },
          { label: '在 Diff 中打开', run: () => {
            selectedPath = path; selectedKind = kind
            root.querySelectorAll('.file').forEach(x => x.classList.toggle('sel', x === el))
            loadDiff()
          } },
          '|',
          { label: '复制路径', run: () => copy(path) },
          { label: '复制文件名', run: () => copy(path.split(/[/\\]/).pop()) },
          { label: '加入 .gitignore', run: async () => {
            const res = await invoke('git/ignore', { paths: [path] })
            toast(res.success ? '已写入 .gitignore' : (res.message || '失败'))
            await refreshStatus(true)
          } },
          '|',
          { label: untracked ? '删除未跟踪文件' : '丢弃本地修改', danger: true, run: async () => {
            const msg = untracked
              ? '永久删除未跟踪文件 ' + path + '？'
              : '丢弃 ' + path + ' 的本地修改？（不可恢复）'
            if (!(await confirmDanger(msg))) return
            const res = await invoke('git/discard', { paths: [path], untracked, allowDangerous })
            toast(res.success ? '已丢弃' : (res.message || '失败'))
            selectedPath = ''
            await refreshStatus(true)
          } }
        ]
        showCtx(e, items)
      }
    })
    const commitBtn = root.querySelector('#btnCommit')
    if (commitBtn) {
      commitBtn.oncontextmenu = (e) => showCtx(e, [
        { cap: '提交' },
        { label: '提交', run: () => commitBtn.click() },
        { label: '勾选「提交后立即推送」', run: () => { const c = $('pushNow'); if (c) c.checked = true } },
        { label: '修正上一提交', danger: true, run: async () => {
          if (!(await confirmDanger('修正上一提交会改写历史。确认？'))) return
          const message = ($('msg')?.value || '').trim()
          const res = await invoke('git/commit', { amend: true, message, allowDangerous })
          if (!reportFail('修正失败', res)) return
          toast('已修正上一提交')
          commitMsg = ''; await refreshAll()
        } }
      ])
    }
  }

  async function paintFiles() {
    const staged = statusData?.staged || []
    const unstaged = statusData?.unstaged || []
    const untracked = statusData?.untracked || []
    const conflicted = statusData?.conflicted || []

    const stillThere =
      (selectedKind === 'staged' && staged.some(x => x.path === selectedPath)) ||
      (selectedKind === 'unstaged' && unstaged.some(x => x.path === selectedPath)) ||
      (selectedKind === 'untracked' && untracked.some(x => x.path === selectedPath)) ||
      (selectedKind === 'conflicted' && conflicted.some(x => x.path === selectedPath))
    if (!selectedPath || !stillThere) {
      if (conflicted[0]) { selectedPath = conflicted[0].path; selectedKind = 'conflicted' }
      else if (unstaged[0]) { selectedPath = unstaged[0].path; selectedKind = 'unstaged' }
      else if (untracked[0]) { selectedPath = untracked[0].path; selectedKind = 'untracked' }
      else if (staged[0]) { selectedPath = staged[0].path; selectedKind = 'staged' }
      else { selectedPath = ''; selectedKind = 'unstaged' }
    }

    applyPaneWidths()
    applyFilesSplit()
    body.className = 'body files-mode'
    body.innerHTML =
      '<aside class="tree" id="tree">' + renderTreeHtml() + '</aside>'
      + '<div class="split-tree" id="splitTree" title="拖动调整分支栏宽度"></div>'
      + '<section class="files">'
      + '<div class="files-bar"><div class="files-search">'
      + '<input id="fileQ" type="search" placeholder="筛选文件…" value="' + esc(fileFilter) + '" />'
      + '</div></div>'
      + '<div class="changes" id="changes">' + changesHtml() + '</div></section>'
      + '<div class="split" id="split" title="拖动调整文件栏宽度"></div>'
      + '<section class="diff-pane">'
      + '<div class="diff-h"><span class="lab" id="diffLab">工作区</span><span class="path" id="diffPath">—</span>'
      + '<span class="stats" id="diffStats"></span><span class="spacer"></span>'
      + '<div class="acts">'
      + '<button type="button" class="btn btn-quiet btn-xs" id="diffStage">暂存</button>'
      + '<button type="button" class="btn btn-danger btn-xs" id="diffDiscard">丢弃</button>'
      + '<button type="button" class="btn btn-ghost btn-xs" id="copyDiff">复制</button>'
      + '</div></div>'
      + '<div class="diff-body" id="diffBody"></div></section>'
      + '<div class="composer" id="composer">'
      + '<div class="composer-top">'
      + '<div class="conv" id="conv">'
      + ['feat', 'fix', 'docs', 'refactor', 'chore', 'perf'].map(t =>
        '<button type="button" data-prefix="' + t + ': " data-type="' + t + '">' + t + '</button>'
      ).join('')
      + '</div>'
      + '<span class="chip ' + (staged.length ? 'ready' : 'idle') + '" id="stagedChip">已暂存 ' + staged.length + '</span>'
      + '</div>'
      + '<div class="composer-body">'
      + '<textarea id="msg" rows="3" spellcheck="true" placeholder="写一句清晰的提交说明…">' + esc(commitMsg) + '</textarea>'
      + '<button type="button" class="btn-commit" id="btnCommit"' + (staged.length ? '' : ' disabled') + '>提交</button>'
      + '</div>'
      + '<div class="composer-foot">'
      + '<div class="composer-opts">'
      + '<label class="push-now"><input type="checkbox" id="chkAmend" /> 修正上一提交</label>'
      + '<label class="push-now"><input type="checkbox" id="pushNow" /> 提交后立即推送</label>'
      + '</div>'
      + '<div class="composer-tools">'
      + '<button type="button" class="btn-link" id="btnStash">贮藏</button>'
      + '<button type="button" class="btn-link danger" id="btnHard" title="reset --hard HEAD">硬重置</button>'
      + '<span class="hint">Ctrl+↵</span>'
      + '</div></div></div>'

    bindTree($('tree'))
    bindFiles(body)
    bindSplits()
    wireStageButtons()
    const msg = $('msg')
    const syncConv = () => {
      commitMsg = msg.value
      const m = /^(feat|fix|docs|refactor|chore|perf|test|style|build|ci)(\(|:)/.exec(msg.value || '')
      const type = m ? m[1] : ''
      $('conv')?.querySelectorAll('button[data-type]').forEach(b => {
        b.classList.toggle('on', b.dataset.type === type)
      })
    }
    msg.oninput = syncConv
    msg.onkeydown = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('btnCommit').click() }
    }
    $('conv').onclick = (e) => {
      const b = e.target.closest('button[data-prefix]')
      if (!b) return
      const prefix = b.dataset.prefix
      const cur = msg.value || ''
      if (/^(feat|fix|docs|refactor|chore|perf|test|style|build|ci)(\(.+\))?:\s/.test(cur)) {
        msg.value = cur.replace(/^(feat|fix|docs|refactor|chore|perf|test|style|build|ci)(\(.+\))?:\s*/, prefix)
      } else {
        msg.value = prefix + cur
      }
      syncConv()
      msg.focus()
      msg.setSelectionRange(msg.value.length, msg.value.length)
    }
    syncConv()
    $('fileQ').oninput = (e) => {
      fileFilter = e.target.value
      refreshChangesList()
    }
    $('copyDiff').onclick = () => copy(lastDiff)
    $('diffStage').onclick = async () => {
      if (!selectedPath) return
      await toggleStagePath(selectedPath, selectedKind)
    }
    $('diffDiscard').onclick = async () => {
      if (!selectedPath || selectedKind === 'staged') return
      const untracked = selectedKind === 'untracked'
      const tip = untracked
        ? '永久删除未跟踪文件 ' + selectedPath + '？'
        : '丢弃 ' + selectedPath + ' 的本地修改？（不可恢复）'
      if (!(await confirmDanger(tip))) return
      const res = await invoke('git/discard', { paths: [selectedPath], untracked, allowDangerous })
      toast(res.success ? '已丢弃' : (res.message || '失败'))
      selectedPath = ''
      await refreshStatus(true)
    }
    async function doCommit() {
      const message = (msg.value || '').trim()
      const amend = !!$('chkAmend')?.checked
      if (!amend && !message) { toast('请填写提交说明'); msg.focus(); return false }
      if (!amend && !staged.length) { toast('暂存区为空'); return false }
      if (amend && !(await confirmDanger('修正上一提交会改写历史，确认？'))) return
      const res = await invoke('git/commit', { message, amend, allowDangerous })
      if (!reportFail(amend ? '修正失败' : '提交失败', res)) return false
      toast(amend ? '已修正上一提交' : '提交成功')
      commitMsg = ''; selectedPath = ''; if ($('chkAmend')) $('chkAmend').checked = false
      await refreshAll()
      return true
    }
    $('btnCommit').onclick = async () => {
      if (!(await doCommit())) return
      if ($('pushNow')?.checked) {
        const { remote, branch } = pushTarget()
        const label = remote + (branch ? '/' + branch : '')
        await withBusy('btnPush', async () => {
          const res = await invoke('git/push', { remote, branch, allowDangerous })
          if (!reportFail('推送失败', res)) return
          toast('已提交并推送 → ' + label)
          await refreshAll()
        }, '正在推送 → ' + label)
      }
    }
    $('btnStash').onclick = async () => {
      const message = (msg.value || '').trim() || 'git-ops stash'
      const res = await invoke('git/stash', { action: 'push', message })
      if (!reportFail('贮藏失败', res)) return
      toast('已贮藏')
      await refreshAll()
    }
    $('btnHard').onclick = async () => {
      if (!(await confirmDanger('确认 reset --hard HEAD？'))) return
      const res = await invoke('git/reset', { mode: 'hard', rev: 'HEAD', allowDangerous })
      if (!reportFail('硬重置失败', res)) return
      toast('已硬重置')
      await refreshAll()
    }
    await loadDiff()
  }

  function openWorking() {
    view = 'working'
    selectedRef = '__working__'
    paint()
  }

  function openHistory(ref, opts) {
    opts = opts || {}
    const r = (ref || '').trim()
    if (!r) return
    view = 'history'
    historyRef = r
    selectedRef = opts.workspace ? '__history__' : r
    selectedRev = ''
    selectedCommitPath = ''
    if (!opts.keepQuery) logQuery = ''
    paint()
  }

  function fmtHistDate(d) {
    const s = String(d || '').replace('T', ' ')
    return s.length >= 16 ? s.slice(0, 16) : s
  }

  function statusLetter(st) {
    const s = String(st || '?').trim()
    if (!s) return '?'
    return s.charAt(0).toUpperCase()
  }

  async function loadCommitDetail(rev) {
    const metaEl = $('histCommit')
    const filesEl = $('histFiles')
    const diffEl = $('histDiffBody')
    if (!metaEl || !filesEl || !diffEl) return
    metaEl.innerHTML = loadingHtml('加载提交…')
    filesEl.innerHTML = ''
    diffEl.innerHTML = loadingHtml('…')
    const res = await invoke('git/show', { rev })
    if (selectedRev !== rev) return
    if (!res.success) {
      metaEl.innerHTML = '<div class="empty">' + esc(res.message || '无法加载提交') + '</div>'
      filesEl.innerHTML = ''
      diffEl.innerHTML = ''
      return
    }
    const files = res.files || []
    metaEl.innerHTML =
      '<div class="hc-sub">' + esc(res.subject || '(无说明)') + '</div>'
      + '<div class="hc-meta">'
      + '<span>' + esc(res.short || rev.slice(0, 7)) + '</span>'
      + '<span>' + esc(res.author || '') + (res.email ? ' &lt;' + esc(res.email) + '&gt;' : '') + '</span>'
      + '<span>' + esc(fmtHistDate(res.date)) + '</span>'
      + (res.parents ? '<span>parents ' + esc(String(res.parents).split(/\s+/).map(p => p.slice(0, 7)).join(' ')) + '</span>' : '')
      + '</div>'
      + (res.body ? '<div class="hc-body">' + esc(res.body) + '</div>' : '')

    if (!selectedCommitPath || !files.some(f => f.path === selectedCommitPath)) {
      selectedCommitPath = files[0]?.path || ''
    }
    filesEl.innerHTML =
      '<div class="hf-h">变更文件 · ' + files.length + '</div>'
      + (files.length ? files.map(f => {
        const st = statusLetter(f.status)
        return '<button type="button" class="hist-file' + (f.path === selectedCommitPath ? ' on' : '') + '" data-cpath="' + esc(f.path) + '">'
          + '<span class="st ' + esc(st) + '">' + esc(st) + '</span><span class="nm" title="' + esc(f.path) + '">' + esc(f.path) + '</span></button>'

  async function loadCommitFileDiff(rev, path) {

    if (!diffEl) return

  function bindHistSplit() {
    const handle = $('splitHist')
    if (!handle) return
    handle.onmousedown = (e) => {
      e.preventDefault()
      handle.classList.add('dragging')
      const hist = handle.parentElement
      const startY = e.clientY
      const startPct = histListPct
      const h = hist.getBoundingClientRect().height || 1
      const onMove = (ev) => {
        const delta = ((ev.clientY - startY) / h) * 100
        histListPct = Math.max(22, Math.min(72, startPct + delta))
        document.documentElement.style.setProperty('--hist-list', histListPct + '%')
      }
      const onUp = () => {
        handle.classList.remove('dragging')
        document.removeEventListener('mousemove', onMove)
        document.removeEventListener('mouseup', onUp)
        remember('git.histListPct', String(Math.round(histListPct)))
      }
      document.addEventListener('mousemove', onMove)
      document.addEventListener('mouseup', onUp)
    }
  }

  function histGraphMeta(commits) {
    const head = String(statusData?.head || '')
    return commits.map((c, i) => {
      const parents = String(c.parents || '').trim().split(/\s+/).filter(Boolean)
      const merge = parents.length > 1 || (c.parentCount || 0) > 1
      const isHead = !!(head && (c.short === head || c.hash.startsWith(head) || head.startsWith(c.short)))
      return { merge, isHead, first: i === 0, last: i === commits.length - 1 }
    })
  }

  function applyHostTheme(info) {
    if (!info) return
    const root = document.documentElement
    const theme = info.theme
    const appearance = info.appearance
    let scheme = theme?.appearance
    if (!scheme && typeof appearance === 'string') scheme = appearance === 'light' ? 'light' : 'dark'
    if (!scheme && appearance?.colorScheme) scheme = appearance.colorScheme
    if (scheme !== 'light' && scheme !== 'dark') {
      scheme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'
    }
    root.setAttribute('data-theme', scheme)
    root.setAttribute('data-dw-theme', scheme)
    root.style.colorScheme = scheme
    const tokens = theme?.tokens
    if (tokens && typeof tokens === 'object') {
      Object.keys(tokens).forEach((key) => {
        if (typeof tokens[key] === 'string' && tokens[key]) root.style.setProperty(key, tokens[key])
      })
    }
    const colors = appearance?.colors || {}
    if (colors.background) root.style.setProperty('--color-background', colors.background)
    if (colors.foreground) root.style.setProperty('--color-foreground', colors.foreground)
    if (colors.primary) root.style.setProperty('--color-primary', colors.primary)
    if (colors.border) root.style.setProperty('--color-border', colors.border)
    // Dark: never inherit host’s ultra-faint --color-border into our chrome tokens.
    // CSS [data-theme=dark] already lifts --line/--muted from --fg; clear any leftover
    // inline --line if a previous theme pass wrote one.
    if (scheme === 'dark') {
      root.style.removeProperty('--line')
      root.style.removeProperty('--muted')
      root.style.removeProperty('--faint')
      root.style.removeProperty('--hover')
      root.style.removeProperty('--fill')
    }
  }

  async function moveHistSelection(delta) {
    const rows = [...body.querySelectorAll('.hist-row')]
    if (!rows.length) return
    let idx = rows.findIndex(r => r.dataset.rev === selectedRev)
    if (idx < 0) idx = delta > 0 ? -1 : 0
    idx = Math.max(0, Math.min(rows.length - 1, idx + delta))
    const row = rows[idx]

  function pushTarget() {
    const up = String(statusData?.upstream || '').trim()
    if (up.includes('/')) {
      const i = up.indexOf('/')
      return { remote: up.slice(0, i), branch: up.slice(i + 1) }
    }
    const remotes = (remotesData?.remotes || []).map(r => r.name).filter(Boolean)
    return { remote: remotes[0] || 'origin', branch: statusData?.branch || '' }
  }

  function remoteNames() {
    const list = (remotesData?.remotes || []).map(r => r.name).filter(Boolean)
    return list.length ? list : ['origin']
  }

  function stripGitProgressNoise(text) {
    const raw = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n')
    const progress = /^(remote:\s*)?(Counting|Compressing|Writing|Receiving|Resolving)\s+[\w ]+:\s*\d+%/i
    const lines = []
    const seen = new Set()
    for (const line of raw.split('\n')) {
      const t = line.trim()
      if (!t) continue
      if (progress.test(t)) continue
      if (/^\d+%\s*\(/.test(t)) continue
      if (seen.has(t)) continue
      seen.add(t)
      lines.push(t)
    }
    return lines.join('\n')
  }

  function reportFail(title, res) {
    if (res?.success) return true
    const msg = stripGitProgressNoise(res?.message || '')
    const err = stripGitProgressNoise(res?.stderr || '')
    let detail = ''
    if (msg && err && err.includes(msg)) detail = err
    else detail = [msg, err].filter(Boolean).join('\n\n').trim()
    if (!detail) detail = '操作失败（无详细输出）'
    const shown = detail.length > 1200 ? detail.slice(0, 1190) + '…' : detail
    confirmText(title || '操作失败', shown, { ok: '复制错误', cancel: '关闭', error: true }).then(ok => {
      if (ok) copy(detail)
    })
    return false
  }

  async function withBusy(btnId, fn, progressTitle) {
    if (busy) return
    busy = true
    const ids = ['btnRefresh', 'btnFetch', 'btnPull', 'btnPullMore', 'btnPush', 'btnPushMore']
    ids.forEach(id => { if ($(id)) $(id).disabled = true })
    if (btnId && $(btnId)) $(btnId).classList.add('is-busy')
    if (progressTitle) showProgress(progressTitle)
    try { await fn() }
    finally {
      busy = false
      if (btnId && $(btnId)) $(btnId).classList.remove('is-busy')
      hideProgress()
      setTop(!!activeRepoId)
    }
  }

  async function doFetch() {
    await withBusy('btnFetch', async () => {
      const res = await invoke('git/fetch', {})
      if (!reportFail('抓取失败', res)) return
      toast('抓取完成')
      await refreshAll()

  async function doPull(rebase) {
    await withBusy('btnPull', async () => {
      const res = await invoke('git/pull', { rebase: !!rebase })
      if (!reportFail(rebase ? '拉取 --rebase 失败' : '拉取失败', res)) return
      toast(rebase ? '拉取 --rebase 完成' : '拉取完成')
      await refreshAll()

  async function doPush(remoteOverride, force) {
    const def = pushTarget()
    const remote = remoteOverride || def.remote
    const branch = def.branch
    const label = remote + (branch ? '/' + branch : '')
    if (force) {
      if (!(await confirmDanger('强制推送到 ' + label + '？（--force-with-lease）'))) return
    } else if (!(await confirmText('推送', '推送到 ' + label + '？'))) {
      return
    }
    await withBusy('btnPush', async () => {
      const res = await invoke('git/push', { remote, branch, force: !!force, allowDangerous })
      if (!reportFail(force ? '强制推送失败' : '推送失败', res)) return
      toast((force ? '强制推送完成 → ' : '推送完成 → ') + label)
      await refreshAll()
    }, (force ? '强制推送 → ' : '正在推送 → ') + label)
  }

  function pushMenu(e) {
    const def = pushTarget()
    const names = remoteNames()
    const items = [{ cap: '推送到' }]
    names.forEach(name => {
      const up = name === def.remote
      items.push({
        label: name + (def.branch ? '/' + def.branch : '') + (up ? ' · 上游' : ''),
        run: () => doPush(name, false)
      })
    })
    if (allowDangerous) {
      items.push('|')
      items.push({
        label: '强制推送 → ' + def.remote + (def.branch ? '/' + def.branch : ''),
        danger: true,
        run: () => doPush(def.remote, true)
      })
    }
    showCtx(e, items)
  }

  async function addRepo() {
    if (busy) return
    let method = 'git/repo-add'
    let params = {}
    if (addMode === 'clone') {
      const url = $('cloneUrl').value.trim()
      const path = $('clonePath').value.trim()
      const name = $('cloneName').value.trim()
      if (!url) return toast('请填写仓库 URL')
      if (!path) return toast('请填写目标文件夹')
      method = 'git/repo-clone'
      params = { url, path, name }
    } else if (addMode === 'init') {
      const path = $('initPath').value.trim()
      const name = $('initName').value.trim()
      const branch = ($('initBranch').value.trim() || 'main')
      if (!path) return toast('请填写新仓库路径')
      method = 'git/repo-init'
      params = { path, name, branch }
    } else {
      const path = $('addPath').value.trim()
      const name = $('addName').value.trim()
      if (!path) return toast('请填写路径')
      params = { path, name }
    }
    busy = true
    $('addConfirm').disabled = true
    const prevLabel = $('addConfirm').textContent
    $('addConfirm').textContent = addMode === 'clone' ? '克隆中…' : (addMode === 'init' ? '初始化…' : '添加中…')
    if (addMode === 'clone') showProgress('正在克隆…')
    try {
      const res = await invoke(method, params)
      if (!reportFail(addMode === 'clone' ? '克隆失败' : addMode === 'init' ? '初始化失败' : '添加失败', res)) return
      toast(res.message || '已就绪')
      closeAdd()
      activeRepoId = res.repoId || activeRepoId
      selectedPath = ''
      await loadRepos()
      await refreshAll()
    } catch (e) { toast(String(e?.message || e)) }
    finally {
      busy = false
      hideProgress()
      if ($('addConfirm')) {
        $('addConfirm').disabled = false
        $('addConfirm').textContent = prevLabel
      }
    }
  }

  async function boot() {
    if (!ready()) { body.innerHTML = '<div class="empty">等待 Host…</div>'; setTimeout(boot, 200); return }
    try {
      if (window.datawisePlugin.ready) await window.datawisePlugin.ready
      const api = window.datawisePlugin
      wireProgressEvents()
      try {
        const info = await api.getHostInfo?.()
        applyHostTheme(info)
        api.onHostInfo?.(applyHostTheme)
        api.onAppearanceChange?.((next) => applyHostTheme({ appearance: next, theme: typeof next === 'object' ? next : undefined }))
        document.addEventListener('datawise-plugin-env', (ev) => applyHostTheme(ev.detail || {}))
      } catch (_) {}
      const ctx = await api.context
      connectionId = ctx?.connectionId || ctx?.connection?.id || ''
      connectionSnapshot = ctx?.connection || null
      if (!connectionId) {
        body.innerHTML = '<div class="empty">请从连接打开工作台</div>'
        return
      }

      allowDangerous = (await recall('git.allowDangerous')) === '1'
      const tw = parseInt(await recall('git.treeWidth'), 10)
      const fw = parseInt(await recall('git.filesWidth'), 10)
      const hp = parseInt(await recall('git.histListPct'), 10)
      const fsp = parseInt(await recall('git.filesSplitPct'), 10)
      if (tw >= 160 && tw <= 420) treeWidth = tw
      if (fw >= 220 && fw <= 520) filesWidth = fw
      if (hp >= 22 && hp <= 72) histListPct = hp
      if (fsp >= 18 && fsp <= 78) filesSplitPct = fsp
      applyPaneWidths()
      applyFilesSplit()
      document.documentElement.style.setProperty('--hist-list', histListPct + '%')
      $('safeBtn').className = 'safe' + (allowDangerous ? ' on' : '')
      $('safeBtn').textContent = allowDangerous ? '危险模式 ON' : '安全模式'
      $('safeBtn').onclick = () => setDanger(!allowDangerous)

      $('repoTrigger').onclick = (e) => { e.stopPropagation(); togglePicker() }
      $('repoQ').oninput = (e) => { repoQuery = e.target.value; renderRepoPanel() }
      document.addEventListener('click', (e) => {
        if (!$('repoPicker').contains(e.target)) closePicker()
      })
      $('btnOpenAdd').onclick = () => openAdd('path')
      document.querySelectorAll('#addTabs [data-add-mode]').forEach(b => {
        b.onclick = () => setAddMode(b.dataset.addMode)
      })
      $('btnDemo').onclick = async () => {
        closePicker()
        const res = await invoke('git/repo-demo', {})
        toast(res.success ? (res.message || '就绪') : (res.message || '失败'))
        if (res.success) {
          activeRepoId = res.repoId || activeRepoId
          selectedPath = ''
          await loadRepos(); await refreshAll()
        }
      }
      $('addCancel').onclick = closeAdd
      $('addConfirm').onclick = addRepo
      ;['addPath', 'addName', 'cloneUrl', 'clonePath', 'cloneName', 'initPath', 'initName', 'initBranch'].forEach(id => {
        if ($(id)) $(id).onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addRepo() } }
      })
      $('addMask').onclick = (e) => { if (e.target === $('addMask')) closeAdd() }
      $('promptCancel').onclick = () => closePrompt(null)
      $('promptOk').onclick = () => closePrompt(($('promptInput').value || '').trim() || null)
      $('promptInput').onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); $('promptOk').click() }
        if (e.key === 'Escape') { e.preventDefault(); closePrompt(null) }
      }
      $('promptMask').onclick = (e) => { if (e.target === $('promptMask')) closePrompt(null) }
      $('confirmCancel').onclick = () => closeConfirm(false)
      $('confirmOk').onclick = () => closeConfirm(true)
      $('confirmMask').onclick = (e) => { if (e.target === $('confirmMask')) closeConfirm(false) }
      document.addEventListener('keydown', (e) => {
        if (!$('confirmMask')?.classList.contains('show')) return
        if (e.key === 'Enter') { e.preventDefault(); closeConfirm(true) }
      })
      $('btnRefresh').onclick = () => withBusy('btnRefresh', () => refreshAll())
      $('btnFetch').onclick = () => doFetch()
      $('btnPull').onclick = () => doPull(false)
      const pullMenu = (e) => showCtx(e, [
        { cap: '拉取' },
        { label: '普通拉取', run: () => doPull(false) },
        { label: '拉取并变基 (--rebase)', run: () => doPull(true) }
      ])
      $('btnPull').oncontextmenu = pullMenu
      $('btnPullMore').onclick = (e) => {
        e.preventDefault()
        e.stopPropagation()
        pullMenu(e)
      }
      $('btnPush').onclick = () => doPush()
      $('btnPush').oncontextmenu = pushMenu
      $('btnPushMore').onclick = (e) => {
        e.preventDefault()
        e.stopPropagation()
        pushMenu(e)
      }
      document.addEventListener('keydown', (e) => {
        const tag = (e.target?.tagName || '').toLowerCase()
        const typing = tag === 'input' || tag === 'textarea' || e.target?.isContentEditable
        if (e.key === '?' && !typing) {
          e.preventDefault()
          showHelp('文件状态 · 分支历史 · 双击检出 · j/k 选择 · Space 暂存 · Ctrl+Enter 提交 · R 刷新')
          return
        }
        if (typing) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('btnCommit')) {
            e.preventDefault(); $('btnCommit').click()
          }
          return
        }
        if (!activeRepoId) return
        if (e.key === 'r' || e.key === 'R') { e.preventDefault(); refreshAll(); return }
        if (view === 'history') {
          if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveHistSelection(1); return }
          if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveHistSelection(-1); return }
          if (e.key === 'Enter' && selectedRev) { e.preventDefault(); loadCommitDetail(selectedRev); return }
          return
        }
        if (view !== 'working') return
        if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveFileSelection(1); return }
        if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveFileSelection(-1); return }
        if (e.key === ' ' || e.key === 's' || e.key === 'S') {
          e.preventDefault()
          if (selectedPath) toggleStagePath(selectedPath, selectedKind)
          return
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault()
          $('msg')?.focus()
          return
        }
        if (e.key === 'a' || e.key === 'A') {
          e.preventDefault()
          $('stageAll')?.click()
          return
        }
      })

      try {
        const tools = await invoke('git/tools', {})
        if (tools && tools.available === false) {
          toast('本机未检测到可用 git：' + (tools.gitBinary || 'git'))
        }
      } catch (_) {}

      await loadRepos()
      if (activeRepoId) await refreshAll()
      else showEmpty()
    } catch (e) {
      body.innerHTML = '<div class="empty">' + esc(e?.message || e) + '</div>'
    }
  }

  boot()
})()
</script>
</body>
</html>
