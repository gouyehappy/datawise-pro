name: Frontend tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'datawise-frontend/**'
      - 'sql-editor/**'
      - 'packages/**'
      - 'datawise-backend/datawise-connectors/capabilities/**'
      - 'datawise-backend/datawise-connectors/datawise-connector-spi/src/main/java/org/apache/datawise/backend/common/DbType.java'
      - 'datawise-backend/datawise-connectors/datawise-connector-spi/src/main/resources/db-type-profiles.properties'
      - 'scripts/generate-connection-capabilities.mjs'
      - 'headless-cli/src/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'datawise-frontend/**'
      - 'sql-editor/**'
      - 'packages/**'
      - 'datawise-backend/datawise-connectors/capabilities/**'
      - 'datawise-backend/datawise-connectors/datawise-connector-spi/src/main/java/org/apache/datawise/backend/common/DbType.java'
      - 'datawise-backend/datawise-connectors/datawise-connector-spi/src/main/resources/db-type-profiles.properties'
      - 'scripts/generate-connection-capabilities.mjs'
      - 'headless-cli/src/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            datawise-frontend/package-lock.json
            sql-editor/package-lock.json

      - name: Install deps
        run: |
          npm ci --prefix sql-editor --ignore-scripts
          npm ci --prefix datawise-frontend --workspaces=false
          # UI framework packages (file: workspace) used by vue-tsc
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: sql-editor unit tests
        working-directory: sql-editor
        run: npm test

      - name: Frontend typecheck
        working-directory: datawise-frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: datawise-frontend
        run: npm run test

      - name: Frontend component tests
        working-directory: datawise-frontend
        run: npm run test:components

      - name: Connection capability matrix check
        run: npm run check:connection-capabilities

      - name: Architecture audits
        working-directory: datawise-frontend
        run: |
          npm run audit:feature-permissions
          npm run audit:layer-imports
          npm run audit:api-facade-imports
          npm run audit:feature-deep-imports

      - name: Plugin catalog audit
        working-directory: datawise-frontend
        run: npm run audit:plugin-catalog:strict

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            datawise-frontend/package-lock.json
            sql-editor/package-lock.json

      - name: Install deps
        run: |
          npm ci --prefix sql-editor --ignore-scripts
          npm ci --prefix datawise-frontend --workspaces=false
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Install Playwright Chromium
        working-directory: datawise-frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E (mock API)
        working-directory: datawise-frontend
        run: npm run test:e2e
