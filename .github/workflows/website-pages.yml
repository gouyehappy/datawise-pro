name: Website Pages

# Marketing site under website/. Docs chapters are optional (docs/user-manual may be local-only).
# Pages deploy only when repo variable ENABLE_GITHUB_PAGES=true.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/user-manual/**'
      - 'docs/image/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install & build
        working-directory: website
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
