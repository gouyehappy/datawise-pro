name: VS Code extension checks

on:
  push:
    branches: [main, dev]
    paths:
      - 'datawise-vscode/**'
      - '.github/workflows/vscode-checks.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'datawise-vscode/**'
      - '.github/workflows/vscode-checks.yml'

concurrency:
  group: vscode-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datawise-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: datawise-vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
