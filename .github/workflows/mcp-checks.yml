name: MCP server checks

on:
  push:
    branches: [main, dev]
    paths:
      - 'datawise-mcp/**'
      - '.github/workflows/mcp-checks.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'datawise-mcp/**'
      - '.github/workflows/mcp-checks.yml'

concurrency:
  group: mcp-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datawise-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: datawise-mcp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
