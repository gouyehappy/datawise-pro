name: Backend tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'datawise-backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'datawise-backend/**'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datawise-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit tests
        run: mvn -B test -DskipITs

      - name: Spotless (common + spi + api + config)
        run: >
          mvn -B -pl
          datawise-common,datawise-connectors/datawise-connector-spi,datawise-connectors/datawise-connector-api,datawise-config
          spotless:check -Dspotless.skip=false
