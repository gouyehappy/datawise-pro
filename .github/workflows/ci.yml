name: CI

# Always-on lightweight gate. Path-filtered suites live in sibling workflows.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check product version alignment
        run: npm run check:version-alignment

  packages-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit packages boundary
        run: npm run audit:packages-boundary

  sensitive-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block internal LAN / brand / creds-in-URL
        run: |
          set -euo pipefail
          # Same rules as scripts/project-config.json → sensitive.contentPatterns
          # Skip binaries and vendored trees.
          if git grep -nIE \
            -e '10\.15\.34\.' \
            -e 'shiji' \
            -e '://[A-Za-z0-9._+-]+:[^/[:space:]@]+@' \
            -- . \
            ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)*.jpeg' ':(exclude)*.gif' ':(exclude)*.webp' \
            ':(exclude)*.jar' ':(exclude)*.dwp' ':(exclude)*.zip' ':(exclude)*.gz' \
            ':(exclude)*.woff' ':(exclude)*.woff2' ':(exclude)*.ttf' \
            ':(exclude)**/node_modules/**' ':(exclude)**/vendor/**' ':(exclude)**/target/**' \
            ':(exclude)scripts/project-config.json' ':(exclude).github/workflows/ci.yml' \
            ':(exclude)scripts/sop/pre-commit-check.mjs'
          then
            echo '::error::Sensitive content found. Desensitize before merge.'
            exit 1
          fi
          echo 'Sensitive content scan clean'
